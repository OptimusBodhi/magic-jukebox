<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Magic Jukebox Beta Feedback Form</title>
  </head>
  <body>
    <!-- Static form detector for Netlify Forms with Next.js static export -->
    <form
      name="magic-jukebox-beta-feedback"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="magic-jukebox-beta-feedback" />
      <input type="text" name="bot-field" />
      <input type="text" name="rating" />
      <input type="text" name="role" />
      <input type="text" name="tags" />
      <textarea name="message"></textarea>
      <input type="email" name="contactEmail" />
      <input type="text" name="activeTab" />
      <input type="text" name="trackCount" />
      <input type="text" name="viewport" />
      <input type="text" name="timestamp" />
    </form>
  </body>
</html>
